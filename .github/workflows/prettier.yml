name: Check Format
on:
  # Scoped to main so a branch with an open PR is not checked twice (once for
  # the push, once for the pull_request) — Dependabot branches made that
  # duplication obvious.
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# This job only reads the repo; it never needs to write anything.
permissions:
  contents: read

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA for the same reason as deploy.yml: a tag can be
      # repointed at new code, a SHA cannot.
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Install 🔧 # Install dependencies
        run: |
          npm ci

      - name: Check Format
        run: |
          npm run check-format
