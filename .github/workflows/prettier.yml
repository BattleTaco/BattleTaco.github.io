name: Check Format
on:
  push:
  pull_request:
    branches:
      - main
      - master

# This job only reads the repo; it never needs to write anything.
permissions:
  contents: read

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA for the same reason as deploy.yml: a tag can be
      # repointed at new code, a SHA cannot.
      - name: Checkout 🛎️
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Install 🔧 # Install dependencies
        run: |
          npm ci

      - name: Check Format
        run: |
          npm run check-format
